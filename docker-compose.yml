services:
  pcap-demo:
    image: ${IMAGE_NAME:-passive-asset-discovery}
    build: .
    restart: "no"
    environment:
      SQLITE_DATABASE_PATH: /work/data/pnad.db
    volumes:
      - ./samples:/samples:ro
      - pcap-demo-data:/work/data
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        asset-discovery --pcap /samples/multi-asset.pcap --sqlite /work/data/pnad.db --output table

  assetd:
    profiles: ["service"]
    image: ${IMAGE_NAME:-passive-asset-discovery}
    build: .
    restart: unless-stopped
    environment:
      SQLITE_DATABASE_PATH: /data/pnad.db
    ports:
      - "${ASSETD_HOST_PORT:-8080}:8080"
    volumes:
      - assetd-data:/data
      - ./samples:/samples:ro
    entrypoint:
      - assetd
    command:
      - --listen-address
      - 0.0.0.0
      - --port
      - "8080"
      - --sqlite
      - /data/pnad.db
      - --pcap
      - /samples/multi-asset.pcap

networks:
  default:
    name: asset-net

volumes:
  pcap-demo-data:
  assetd-data:
