services:
  pcap-demo:
    image: ${IMAGE_NAME:-passive-asset-discovery}
    build: .
    restart: "no"
    environment:
      SQLITE_DATABASE_PATH: /work/data/pnad.db
    volumes:
      - ./samples:/samples:ro
      - pcap-demo-data:/work/data
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        asset-discovery --pcap /samples/multi-asset.pcap --sqlite /work/data/pnad.db --output table

networks:
  default:
    name: asset-net

volumes:
  pcap-demo-data:
